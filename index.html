<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dryline · Presupuestos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
  :root{
    --amarillo:#FFD21E;
    --amarillo-oscuro:#8a6f00;
    --negro:#080808;
    --panel:#111111;
    --panel2:#0d0d0d;
    --borde:#1f1f1f;
    --borde-fuerte:#2c2c2c;
    --texto:#ececE6;
    --texto2:#8f8f88;
    --apagado:#5a5a54;
    --activo-bg:#1b1602;
    --font-display:'Syne',sans-serif;
    --font-ui:'Space Grotesk',system-ui,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--negro);color:var(--texto);font-family:var(--font-ui);font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased;}

  /* HEADER */
  header{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:18px 28px;border-bottom:1px solid var(--borde);
    position:sticky;top:0;z-index:50;background:rgba(8,8,8,.92);backdrop-filter:blur(8px);
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand svg{width:34px;height:34px;display:block;}
  .brand .name{font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:-.5px;line-height:1;}
  .brand .name b{color:var(--amarillo);font-weight:800;}
  .brand .tag{font-size:11px;color:var(--texto2);letter-spacing:.4px;margin-top:3px;}
  .head-right{font-size:11px;color:var(--apagado);text-align:right;line-height:1.7;}

  main{max-width:840px;margin:0 auto;padding:32px 22px 72px;}

  .section{margin-bottom:30px;}
  .section-title{
    font-size:11px;letter-spacing:1.8px;color:var(--amarillo);font-weight:700;
    text-transform:uppercase;border-bottom:1px solid var(--borde);
    padding-bottom:9px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:baseline;
  }
  .section-title .hint{color:var(--apagado);font-weight:400;letter-spacing:.3px;text-transform:none;font-size:11px;}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field label{display:block;font-size:11px;letter-spacing:.4px;color:var(--texto2);margin-bottom:6px;}
  .field input,.field textarea,.field select{
    width:100%;background:var(--panel);border:1px solid var(--borde);border-radius:9px;
    padding:11px 14px;color:var(--texto);font-family:var(--font-ui);font-size:14px;outline:none;
    transition:border-color .15s;
  }
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--amarillo);}
  .field input::placeholder,.field textarea::placeholder{color:#4a4a44;}
  .field textarea{resize:vertical;}
  .fecha-text{margin-top:10px;font-size:12px;color:var(--apagado);}

  /* ADD ITEM FORM */
  .add-form{background:var(--panel);border:1px solid var(--borde);border-radius:12px;padding:16px;}
  .add-grid{display:grid;grid-template-columns:1fr 90px 90px 130px;gap:10px;align-items:end;}
  .add-grid .full{grid-column:1/-1;}
  .btn-add-wrap{grid-column:1/-1;display:flex;justify-content:flex-end;margin-top:12px;}

  /* ITEM LIST */
  .items-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .item-row{
    display:grid;grid-template-columns:1fr 84px 120px 30px;gap:10px;align-items:center;
    background:var(--panel);border:1px solid var(--borde);border-radius:10px;padding:11px 14px;
  }
  .it-desc{font-size:14px;color:var(--texto);line-height:1.35;}
  .it-meta{font-size:11px;color:var(--amarillo);margin-top:3px;}
  .it-qty{
    width:100%;background:var(--negro);border:1px solid var(--borde-fuerte);border-radius:7px;
    padding:8px;color:var(--texto);font-family:var(--font-ui);font-size:15px;font-weight:500;
    text-align:center;outline:none;transition:border-color .15s;
  }
  .it-qty:focus{border-color:var(--amarillo);}
  .it-sub{text-align:right;font-weight:700;font-size:14px;color:var(--amarillo);}
  .it-del{background:none;border:none;color:#4a4a44;cursor:pointer;font-size:15px;padding:0;transition:color .15s;}
  .it-del:hover{color:#e5555f;}
  .empty-msg{font-size:13px;color:#3c3c38;padding:14px;text-align:center;border:1px dashed var(--borde);border-radius:10px;}

  /* AJUSTES */
  .ajustes{display:flex;flex-wrap:wrap;gap:20px;align-items:center;}
  .ajustes .field{min-width:150px;}
  .check{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;color:var(--texto);user-select:none;padding-top:22px;}
  .check input{width:17px;height:17px;accent-color:var(--amarillo);cursor:pointer;}

  /* TOTAL BOX */
  .total-box{background:var(--amarillo);border-radius:12px;padding:22px 26px;margin:6px 0 22px;}
  .total-box .tl{font-size:11px;letter-spacing:1.4px;color:var(--amarillo-oscuro);text-transform:uppercase;font-weight:700;margin-bottom:6px;}
  .total-box .tv{font-family:var(--font-display);font-size:42px;font-weight:800;color:var(--negro);letter-spacing:-1.5px;line-height:1;}
  .total-box .tsub{margin-top:10px;font-size:12px;color:#5f5100;display:flex;flex-wrap:wrap;gap:4px 18px;}
  .total-box .tsub b{font-weight:700;}

  /* RESUMEN TABLE */
  .tabla-wrap{background:var(--panel);border:1px solid var(--borde);border-radius:12px;overflow:hidden;margin-bottom:14px;}
  .tabla-header{padding:15px 20px;border-bottom:1px solid var(--borde);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .th-cliente{font-weight:700;font-size:15px;}
  .th-obra{font-size:12px;color:var(--texto2);margin-top:3px;}
  .th-right{font-size:11px;color:var(--apagado);text-align:right;line-height:1.6;}
  .th-right .badge{color:var(--amarillo);font-family:var(--font-display);font-weight:700;margin-top:2px;letter-spacing:.5px;}
  table{width:100%;border-collapse:collapse;}
  thead th{padding:11px 18px;text-align:left;font-size:10px;letter-spacing:1px;color:var(--apagado);font-weight:700;text-transform:uppercase;border-bottom:1px solid var(--borde);background:#161616;}
  thead th.c{text-align:center;}thead th.r{text-align:right;}
  tbody td{padding:11px 18px;border-bottom:1px solid var(--borde);color:var(--texto);font-size:13px;}
  tbody td.c{text-align:center;color:var(--texto2);}tbody td.r{text-align:right;}
  tbody tr:nth-child(even){background:var(--panel2);}
  tr.sumline td{color:var(--texto2);font-size:12px;border-bottom:none;padding-top:8px;padding-bottom:4px;}
  tr.sumline td.r{color:var(--texto);}
  tfoot td{padding:13px 18px;font-weight:700;color:var(--negro);font-size:15px;background:var(--amarillo);}
  tfoot td.r{text-align:right;font-size:17px;}

  .aviso{font-size:12px;color:var(--texto2);padding:11px 15px;background:var(--panel);border:1px solid var(--borde);border-radius:9px;margin-bottom:14px;line-height:1.5;}

  /* BOTONES */
  .btn{font-family:var(--font-ui);font-size:13px;font-weight:700;letter-spacing:.3px;border-radius:9px;padding:12px 22px;cursor:pointer;transition:all .15s;border:1.5px solid transparent;}
  .btn-amarillo{background:var(--amarillo);color:var(--negro);border-color:var(--amarillo);}
  .btn-amarillo:hover{filter:brightness(1.08);}
  .btn-outline{background:transparent;color:var(--amarillo);border-color:var(--amarillo);}
  .btn-outline:hover{background:var(--amarillo);color:var(--negro);}
  .btn-ghost{background:transparent;color:var(--texto2);border-color:var(--borde-fuerte);}
  .btn-ghost:hover{border-color:#555;color:var(--texto);}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}

  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
  input[type=number]{-moz-appearance:textfield;}

  @media (max-width:640px){
    header{padding:14px 18px;}
    main{padding:24px 16px 60px;}
    .grid-2{grid-template-columns:1fr;}
    .add-grid{grid-template-columns:1fr 1fr;}
    .add-grid .full{grid-column:1/-1;}
    .item-row{grid-template-columns:1fr 70px 28px;grid-template-areas:"desc qty del" "sub sub sub";row-gap:8px;}
    .item-row .it-main{grid-area:desc;}
    .item-row .it-qty{grid-area:qty;}
    .item-row .it-del{grid-area:del;}
    .item-row .it-sub{grid-area:sub;text-align:left;}
    .head-right{display:none;}
    .total-box .tv{font-size:34px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="30 16 168 168" xmlns="http://www.w3.org/2000/svg" aria-label="Dryline">
      <path fill-rule="evenodd" fill="#FFD21E" d="M54 40 L118 40 C154 40 174 66 174 100 C174 134 154 160 118 160 L70 160 Q54 160 54 144 L54 40 Z M84 90 L152 90 L152 110 L84 110 Z"/>
    </svg>
    <div>
      <div class="name"><b>D</b>ryline</div>
      <div class="tag">Presupuestos · Construcción en seco</div>
    </div>
  </div>
  <div class="head-right">Grupo Voltum<br/>Córdoba, Argentina</div>
</header>

<main>
  <!-- DATOS -->
  <div class="section">
    <div class="section-title">Datos de la obra</div>
    <div class="grid-2">
      <div class="field"><label>Cliente</label><input id="cliente" type="text" placeholder="Nombre del cliente"/></div>
      <div class="field"><label>Dirección / obra</label><input id="obra" type="text" placeholder="Ej: Av. Colón 1200, Córdoba"/></div>
    </div>
    <div class="fecha-text" id="fecha-display"></div>
  </div>

  <!-- ITEMS -->
  <div class="section">
    <div class="section-title">Ítems del presupuesto <span class="hint">vos cargás cada uno con su precio</span></div>
    <div class="items-list" id="items-list"></div>
    <div class="add-form">
      <div class="add-grid">
        <div class="field full"><label>Descripción</label><input id="n-desc" type="text" placeholder="Ej: Tabique de placa de yeso doble cara, 12,5 mm"/></div>
        <div class="field"><label>Unidad</label>
          <select id="n-unidad">
            <option value="m²">m²</option>
            <option value="ml">ml</option>
            <option value="u">u</option>
            <option value="global">global</option>
            <option value="día">día</option>
          </select>
        </div>
        <div class="field"><label>Cantidad</label><input id="n-cant" type="number" min="0" step="any" placeholder="0"/></div>
        <div class="field" style="grid-column:span 2;"><label>Precio unitario $</label><input id="n-precio" type="number" min="0" step="any" placeholder="0"/></div>
      </div>
      <div class="btn-add-wrap"><button class="btn btn-amarillo" id="btn-add">+ Agregar ítem</button></div>
    </div>
  </div>

  <!-- AJUSTES -->
  <div class="section">
    <div class="section-title">Ajustes <span class="hint">opcional</span></div>
    <div class="ajustes">
      <div class="field"><label>Descuento (%)</label><input id="descuento" type="number" min="0" max="100" step="any" placeholder="0"/></div>
      <label class="check"><input type="checkbox" id="iva"/> Agregar IVA (21%)</label>
    </div>
  </div>

  <!-- NOTAS -->
  <div class="section">
    <div class="section-title">Notas / condiciones</div>
    <div class="field"><textarea id="notas" rows="2" placeholder="Ej: Validez del presupuesto: 15 días. Anticipo 40% para inicio, saldo contra avance de obra. No incluye pintura ni instalaciones."></textarea></div>
  </div>

  <!-- RESUMEN -->
  <div class="section" id="seccion-resumen" style="display:none;">
    <div class="section-title">Resumen</div>
    <div class="total-box">
      <div class="tl">Total del presupuesto</div>
      <div class="tv" id="total-val">$ 0</div>
      <div class="tsub" id="total-sub"></div>
    </div>
    <div class="tabla-wrap">
      <div class="tabla-header" id="tabla-header" style="display:none;">
        <div>
          <div class="th-cliente" id="th-cliente"></div>
          <div class="th-obra" id="th-obra"></div>
        </div>
        <div class="th-right">
          <div id="th-fecha"></div>
          <div class="badge">DRYLINE</div>
        </div>
      </div>
      <table>
        <thead><tr><th>Concepto</th><th class="c" style="width:110px">Cant.</th><th class="r" style="width:140px">Subtotal</th></tr></thead>
        <tbody id="tabla-body"></tbody>
      </table>
    </div>
    <div class="aviso" id="aviso-notas"></div>
    <div class="btn-row">
      <button class="btn btn-amarillo" onclick="copiarWhatsapp()">Copiar para WhatsApp</button>
      <button class="btn btn-outline" onclick="exportarPDF()">Exportar PDF</button>
      <button class="btn btn-ghost" onclick="nuevoPresupuesto()">Nuevo presupuesto</button>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
// ── Estado ───────────────────────────────────────────────────────────────────
let items = [];
let nextId = 0;
window._calc = {subtotal:0,descPct:0,descMonto:0,ivaOn:false,ivaMonto:0,total:0};

// ── Helpers ──────────────────────────────────────────────────────────────────
function fmt(n){ return "$ " + Number(n||0).toLocaleString("es-AR",{maximumFractionDigits:0}); }
function getV(id){ const e=document.getElementById(id); return e?e.value.trim():""; }
function getN(id){ const e=document.getElementById(id); return e?(parseFloat(e.value)||0):0; }
function getFecha(){ return new Date().toLocaleDateString("es-AR",{day:"2-digit",month:"long",year:"numeric"}); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

document.getElementById("fecha-display").textContent = "Fecha: " + getFecha();

// ── Logo Dryline a PNG (para el PDF, dibujado en canvas, sin recursos externos) ─
function logoPNG(color, size){
  try{
    const c=document.createElement("canvas"); c.width=size; c.height=size;
    const ctx=c.getContext("2d");
    const p=new Path2D("M54 40 L118 40 C154 40 174 66 174 100 C174 134 154 160 118 160 L70 160 Q54 160 54 144 L54 40 Z M84 90 L152 90 L152 110 L84 110 Z");
    const pad=size*0.10, avail=size-2*pad, s=avail/120;
    ctx.setTransform(s,0,0,s, size/2 - s*114, size/2 - s*100);
    ctx.fillStyle=color; ctx.fill(p,"evenodd");
    return c.toDataURL("image/png");
  }catch(e){ return null; }
}
window._logoAmarillo = logoPNG("#FFD21E", 256);

// ── Render de ítems ──────────────────────────────────────────────────────────
const listEl = document.getElementById("items-list");
function renderItems(){
  if(items.length===0){
    listEl.innerHTML = '<div class="empty-msg">Todavía no cargaste ítems. Agregá el primero abajo.</div>';
    calc(); return;
  }
  listEl.innerHTML = items.map(it => `
    <div class="item-row" data-id="${it.id}">
      <div class="it-main">
        <div class="it-desc">${esc(it.desc)}</div>
        <div class="it-meta">${fmt(it.precio)} / ${esc(it.unidad)}</div>
      </div>
      <input class="it-qty" type="number" min="0" step="any" value="${it.cant}" data-id="${it.id}" aria-label="Cantidad"/>
      <div class="it-sub" id="sub-${it.id}">${fmt(it.cant*it.precio)}</div>
      <button class="it-del" data-id="${it.id}" title="Quitar" aria-label="Quitar ítem">✕</button>
    </div>`).join("");
  calc();
}

// Editar cantidad en línea sin perder foco
listEl.addEventListener("input", e=>{
  const inp = e.target.closest(".it-qty"); if(!inp) return;
  const id = +inp.dataset.id;
  const it = items.find(x=>x.id===id); if(!it) return;
  it.cant = parseFloat(inp.value)||0;
  const sub = document.getElementById("sub-"+id);
  if(sub) sub.textContent = fmt(it.cant*it.precio);
  calc();
});
// Quitar ítem
listEl.addEventListener("click", e=>{
  const b = e.target.closest(".it-del"); if(!b) return;
  items = items.filter(x=>x.id !== +b.dataset.id);
  renderItems();
});

// ── Agregar ítem ─────────────────────────────────────────────────────────────
function agregarItem(){
  const desc = getV("n-desc");
  const unidad = getV("n-unidad") || "u";
  const cant = getN("n-cant");
  const precio = getN("n-precio");
  if(!desc){ document.getElementById("n-desc").focus(); return; }
  if(precio<=0){ document.getElementById("n-precio").focus(); return; }
  items.push({id:++nextId, desc, unidad, cant: cant>0?cant:1, precio});
  document.getElementById("n-desc").value="";
  document.getElementById("n-cant").value="";
  document.getElementById("n-precio").value="";
  renderItems();
  document.getElementById("n-desc").focus();
}
document.getElementById("btn-add").addEventListener("click", agregarItem);
["n-desc","n-cant","n-precio"].forEach(id=>{
  document.getElementById(id).addEventListener("keydown", e=>{ if(e.key==="Enter") agregarItem(); });
});
document.getElementById("descuento").addEventListener("input", calc);
document.getElementById("iva").addEventListener("change", calc);
document.getElementById("cliente").addEventListener("input", calc);
document.getElementById("obra").addEventListener("input", calc);
document.getElementById("notas").addEventListener("input", calc);

// ── Cálculo + resumen ────────────────────────────────────────────────────────
function calc(){
  const subtotal = items.reduce((a,it)=>a + it.cant*it.precio, 0);
  const descPct = Math.min(Math.max(getN("descuento"),0),100);
  const descMonto = subtotal * descPct/100;
  const neto = subtotal - descMonto;
  const ivaOn = document.getElementById("iva").checked;
  const ivaMonto = ivaOn ? neto*0.21 : 0;
  const total = neto + ivaMonto;
  window._calc = {subtotal, descPct, descMonto, ivaOn, ivaMonto, total};

  const resumen = document.getElementById("seccion-resumen");
  if(items.length===0 || total<=0 && subtotal<=0){ resumen.style.display="none"; return; }
  resumen.style.display="block";

  document.getElementById("total-val").textContent = fmt(total);
  const sub=[];
  sub.push(`Subtotal <b>${fmt(subtotal)}</b>`);
  if(descMonto>0) sub.push(`Descuento ${descPct}% <b>-${fmt(descMonto)}</b>`);
  if(ivaOn) sub.push(`IVA 21% <b>${fmt(ivaMonto)}</b>`);
  document.getElementById("total-sub").innerHTML = sub.join("");

  // header tabla
  const cliente=getV("cliente"), obra=getV("obra");
  const th=document.getElementById("tabla-header");
  th.style.display = (cliente||obra) ? "flex" : "none";
  document.getElementById("th-cliente").textContent = cliente;
  document.getElementById("th-obra").textContent = obra;
  document.getElementById("th-fecha").textContent = getFecha();

  // body
  const tb=document.getElementById("tabla-body");
  let rows = items.map(it=>`<tr><td>${esc(it.desc)}</td><td class="c">${it.cant} ${esc(it.unidad)}</td><td class="r">${fmt(it.cant*it.precio)}</td></tr>`).join("");
  rows += `<tr class="sumline"><td>Subtotal</td><td></td><td class="r">${fmt(subtotal)}</td></tr>`;
  if(descMonto>0) rows += `<tr class="sumline"><td>Descuento ${descPct}%</td><td></td><td class="r">-${fmt(descMonto)}</td></tr>`;
  if(ivaOn) rows += `<tr class="sumline"><td>IVA 21%</td><td></td><td class="r">${fmt(ivaMonto)}</td></tr>`;
  tb.innerHTML = rows;

  // total en tfoot
  let tfoot = document.querySelector("#seccion-resumen tfoot");
  if(!tfoot){ tfoot=document.createElement("tfoot"); document.querySelector("#seccion-resumen table").appendChild(tfoot); }
  tfoot.innerHTML = `<tr><td>Total general</td><td></td><td class="r">${fmt(total)}</td></tr>`;

  // aviso / notas
  const notas=getV("notas");
  document.getElementById("aviso-notas").textContent = notas || "Los valores no incluyen materiales ni trabajos no detallados en este presupuesto.";
}

// ── Copiar para WhatsApp ─────────────────────────────────────────────────────
function copiarWhatsapp(){
  if(items.length===0){ alert("Cargá al menos un ítem."); return; }
  const {subtotal,descPct,descMonto,ivaOn,ivaMonto,total}=window._calc;
  const cliente=getV("cliente"), obra=getV("obra"), notas=getV("notas");
  const L=[];
  L.push("*DRYLINE — Presupuesto*");
  L.push("Construcción en seco");
  L.push(getFecha());
  if(cliente) L.push("Cliente: "+cliente);
  if(obra) L.push("Obra: "+obra);
  L.push("");
  L.push("————————————————");
  items.forEach(it=>{ L.push(`• ${it.desc}\n   ${it.cant} ${it.unidad} × ${fmt(it.precio)} = ${fmt(it.cant*it.precio)}`); });
  L.push("————————————————");
  L.push("Subtotal: "+fmt(subtotal));
  if(descMonto>0) L.push(`Descuento ${descPct}%: -`+fmt(descMonto));
  if(ivaOn) L.push("IVA 21%: "+fmt(ivaMonto));
  L.push("*TOTAL: "+fmt(total)+"*");
  L.push("");
  if(notas) L.push(notas);
  navigator.clipboard.writeText(L.join("\n")).then(()=>{
    const b=document.querySelector(".btn-amarillo[onclick*='copiar'], .btn-row .btn-amarillo");
    const btn=[...document.querySelectorAll(".btn")].find(x=>x.textContent.includes("WhatsApp"));
    if(btn){ const o=btn.textContent; btn.textContent="✓ Copiado"; setTimeout(()=>btn.textContent=o,1800); }
  }).catch(()=>alert("No se pudo copiar."));
}

// ── Exportar PDF ─────────────────────────────────────────────────────────────
function exportarPDF(){
  if(!window.jspdf || !window.jspdf.jsPDF){ alert("Cargando el generador de PDF, probá de nuevo en un segundo."); return; }
  if(items.length===0){ alert("Cargá al menos un ítem."); return; }
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const W=210, M=16;
  const amarillo=[255,210,30], negro=[8,8,8], gris=[247,247,244], txt2=[140,140,132];
  const nro=Math.floor(Math.random()*9000)+1000;
  const {subtotal,descPct,descMonto,ivaOn,ivaMonto,total}=window._calc;

  // Header negro con logo
  const HH=38;
  doc.setFillColor(...negro); doc.rect(0,0,W,HH,"F");
  if(window._logoAmarillo){ doc.addImage(window._logoAmarillo,"PNG", M, (HH-20)/2, 20, 20); }
  doc.setTextColor(...amarillo); doc.setFont("helvetica","bold"); doc.setFontSize(22);
  doc.text("DRYLINE", M+24, HH/2-1);
  doc.setTextColor(180,180,170); doc.setFont("helvetica","normal"); doc.setFontSize(8);
  doc.text("Construcción en seco", M+24, HH/2+5);

  // Franja amarilla
  doc.setFillColor(...amarillo); doc.rect(0,HH,W,10,"F");
  doc.setTextColor(...negro); doc.setFont("helvetica","bold"); doc.setFontSize(8.5);
  doc.text(`PRESUPUESTO N° ${nro}   ·   ${getFecha()}`, M, HH+6.6);

  let y=60;
  const cliente=getV("cliente"), obra=getV("obra");
  const boxes=[
    {l:"CLIENTE", v:cliente||"—", s:obra||""},
    {l:"FECHA", v:getFecha(), s:""},
    {l:"ÍTEMS", v:items.length+"", s:""},
  ];
  boxes.forEach((b,i)=>{
    const bx=M+i*((W-2*M-8)/3)+ (i? i*4:0);
    const bw=(W-2*M-8)/3;
    doc.setFillColor(...gris); doc.roundedRect(bx,y,bw,18,2,2,"F");
    doc.setFont("helvetica","normal"); doc.setFontSize(7); doc.setTextColor(150,150,145);
    doc.text(b.l,bx+4,y+5);
    doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(...negro);
    doc.text(doc.splitTextToSize(b.v,bw-8)[0]||"—",bx+4,y+11);
    if(b.s){ doc.setFont("helvetica","normal"); doc.setFontSize(7); doc.setTextColor(120,120,115); doc.text(doc.splitTextToSize(b.s,bw-8)[0],bx+4,y+16); }
  });
  y+=26;

  const body=items.map(it=>[it.desc, `${it.cant} ${it.unidad}`, fmt(it.cant*it.precio)]);
  doc.autoTable({
    startY:y, margin:{left:M,right:M},
    head:[["CONCEPTO","CANTIDAD","SUBTOTAL"]],
    body,
    headStyles:{fillColor:negro,textColor:amarillo,fontSize:8,fontStyle:"bold"},
    bodyStyles:{fontSize:9,textColor:negro,cellPadding:2.6},
    columnStyles:{0:{cellWidth:"auto"},1:{halign:"center",cellWidth:34},2:{halign:"right",cellWidth:40}},
    alternateRowStyles:{fillColor:gris},
  });
  y=doc.lastAutoTable.finalY+6;

  // Totales
  const lineas=[["Subtotal",fmt(subtotal)]];
  if(descMonto>0) lineas.push([`Descuento ${descPct}%`,"-"+fmt(descMonto)]);
  if(ivaOn) lineas.push(["IVA 21%",fmt(ivaMonto)]);
  const boxX=W-M-80;
  doc.setFontSize(9);
  lineas.forEach(([l,v])=>{
    doc.setFont("helvetica","normal"); doc.setTextColor(90,90,85);
    doc.text(l, boxX, y+4);
    doc.setFont("helvetica","bold"); doc.setTextColor(...negro);
    doc.text(v, W-M, y+4, {align:"right"});
    y+=6;
  });
  y+=1;
  doc.setFillColor(...amarillo); doc.roundedRect(boxX-4,y,80+4,12,2,2,"F");
  doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...negro);
  doc.text("TOTAL", boxX, y+8);
  doc.setFontSize(13); doc.text(fmt(total), W-M-3, y+8.5, {align:"right"});
  y+=20;

  // Notas / condiciones
  const notas=getV("notas") || "Los valores no incluyen materiales ni trabajos no detallados en este presupuesto.";
  const nl=doc.splitTextToSize(notas, W-2*M-8);
  const nh=10+nl.length*4.6;
  doc.setFillColor(...gris); doc.roundedRect(M,y,W-2*M,nh,2,2,"F");
  doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(...negro);
  doc.text("NOTAS / CONDICIONES", M+4, y+6);
  doc.setFont("helvetica","normal"); doc.setTextColor(80,80,78);
  doc.text(nl, M+4, y+12);
  y+=nh;

  // Firma
  y=Math.max(y+18, 248);
  doc.setDrawColor(180,180,175); doc.line(W-M-52,y,W-M,y);
  doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(150,150,145);
  doc.text("Firma y aclaración", W-M-26, y+5, {align:"center"});

  // Footer
  doc.setFillColor(...negro); doc.rect(0,285,W,12,"F");
  doc.setTextColor(...amarillo); doc.setFont("helvetica","bold"); doc.setFontSize(8);
  doc.text("DRYLINE", M, 292.4);
  doc.setTextColor(170,170,162); doc.setFont("helvetica","normal");
  doc.text(`Construcción en seco · Presupuesto N° ${nro}`, W/2, 292.4, {align:"center"});
  doc.setTextColor(...amarillo);
  doc.text("Grupo Voltum", W-M, 292.4, {align:"right"});

  doc.save(`Presupuesto-Dryline-${nro}.pdf`);
}

// ── Nuevo presupuesto ────────────────────────────────────────────────────────
function nuevoPresupuesto(){
  if(items.length && !confirm("¿Empezar un presupuesto nuevo? Se van a borrar los ítems cargados.")) return;
  items=[]; nextId=0;
  ["cliente","obra","notas","n-desc","n-cant","n-precio","descuento"].forEach(id=>{ const e=document.getElementById(id); if(e) e.value=""; });
  document.getElementById("iva").checked=false;
  document.getElementById("n-unidad").value="m²";
  renderItems();
  window.scrollTo({top:0,behavior:"smooth"});
}

// init
renderItems();
</script>
</body>
</html>
